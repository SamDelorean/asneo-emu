name: NEO portable C++ regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run shared NEO hardware components
        run: |
          set -euo pipefail
          mkdir -p /tmp/asneo-tests
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Isrc/mame/skeleton tests/neo_components.cpp -o /tmp/asneo-tests/components
          /tmp/asneo-tests/components
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Isrc/mame/skeleton tests/neo_vz_core.cpp -o /tmp/asneo-tests/vz_core
          /tmp/asneo-tests/vz_core
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Isrc/mame/skeleton tests/neo_nor.cpp -o /tmp/asneo-tests/nor
          /tmp/asneo-tests/nor
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Isrc/mame/skeleton tests/neo_isp1763.cpp -o /tmp/asneo-tests/isp1763
          /tmp/asneo-tests/isp1763
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Isrc/mame/skeleton tests/neo_usb_ports.cpp -o /tmp/asneo-tests/usb_ports
          /tmp/asneo-tests/usb_ports
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Isrc/mame/skeleton tests/neo_vz_spi.cpp -o /tmp/asneo-tests/spi
          /tmp/asneo-tests/spi
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Isrc/mame/skeleton tests/neo_vz_pwm.cpp -o /tmp/asneo-tests/pwm
          /tmp/asneo-tests/pwm
